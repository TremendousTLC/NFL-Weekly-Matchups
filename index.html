<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NFL Weekly Matchup-36</title>
	<script defer src="script.js?v=36"></script>
    <link rel="stylesheet" href="styles24.css">
</head>

<body>

    <!-- LOGO BANNER -->
    <div id="logo-banner"></div>

    <!-- MAIN LAYOUT -->
    <div id="main-layout">

        <!-- LEFT PANEL -->
        <div id="left-panel">

            <h2>Player</h2>

            <input id="player-name-input" type="text" placeholder="Enter name">
            <button onclick="addPlayer()">Add Player</button>

            <select id="player-list"></select>

            <button onclick="deletePlayer()">Delete Player</button>
            <button onclick="showWeeklyPicks()">Show Weekly Picks</button>

            <h2>Pick Details</h2>
            <div id="picks-detail-window"></div>

            <h2>League Standings</h2>

            <div class="standings-box">
                <h3>Weekly Leaderboard</h3>
            </div>

            <div class="standings-box">
                <h3>Season Standings</h3>
            </div>

        </div>

        <!-- WEEKLY PICKS PANEL -->
        <div id="weekly-picks-panel">

            <h2>Weekly Picks — <span id="current-week-label"></span></h2>

            <div id="week-nav">
                <button onclick="changeWeek(-1)">Prev</button>
                <span id="current-week-nav"></span>
                <button onclick="changeWeek(1)">Next</button>
            </div>

            <div id="weekly-picks"></div>

            <div class="picks-actions">
                <button onclick="submitPicks()">Submit Picks</button>
                <button onclick="editPicks()">Edit Picks</button>
            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div id="right-panel">

            <h2 id="nfl-title">
                NFL Team Standings
                <span id="current-nfl-week"></span>
            </h2>

            <div class="standings-box">
                <button onclick="showAFCStandings()">AFC Standings</button>
            </div>

            <div class="standings-box">
                <button onclick="showNFCStandings()">NFC Standings</button>
            </div>

            <div class="standings-box">
                <button onclick="showAFCLeaders()">AFC Team Leaders</button>
            </div>

            <div class="standings-box">
                <button onclick="showNFCLeaders()">NFC Team Leaders</button>
            </div>

            <div class="standings-box">
                <button onclick="showPlayoffs()">NFL Playoffs</button>
            </div>

        </div>

    </div>

</body>
</html>
