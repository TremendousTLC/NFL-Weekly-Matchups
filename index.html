<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NFL Weekly Matchup - 002</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top Logo Banner -->
  <div id="logo-banner">
    <!-- You can add <img class="teamLogo" src="..."> here -->
    <span>NFL Weekly Matchup</span>
  </div>

  <div id="app">
    <!-- LEFT: LEAGUE PANEL -->
    <div id="left-column">
      <section id="league-panel">
        <h2>League</h2>

        <div class="league-current-player">
          <input id="player-name-input" type="text" placeholder="Player / Team Name">
          <button id="add-player-btn">Add Player</button>
        </div>

        <div>
          <label for="player-list">Current Player:</label>
          <select id="player-list"></select>
        </div>

        <div class="league-stats">
          <p>Total Participants: <span id="total-participants">0</span></p>
        </div>

        <h3>Season Leaderboard</h3>
        <div id="season-leaderboard"></div>

        <h3>Player Picks</h3>
        <div id="player-picks-panel"></div>

        <h3>Manage Players</h3>
        <section id="player-management">
          <button id="delete-player-btn">Delete Player</button>
        </section>
      </section>
    </div>

    <!-- MIDDLE: WEEKLY PICKS -->
    <section id="picks-panel">
      <div id="weekly-picks-container">
        <h2 id="weekly-title">Weekly Picks</h2>

        <div id="week-selector">
          <button id="prev-week-btn">◀</button>
          <span id="picks-current-week">Week 1</span>
          <button id="next-week-btn">▶</button>
        </div>

        <div id="weekly-picks"></div>

        <div class="picks-actions">
          <button id="submit-picks-btn">Submit Picks</button>
          <button id="edit-picks-btn">Edit Picks</button>
        </div>

        <div id="picks-detail-window"></div>
      </div>
    </section>

    <!-- RIGHT: NFL DASHBOARD -->
    <section id="nfl-panel">
      <h2>NFL Dashboard</h2>
      <p>Current NFL Week: <span id="current-nfl-week">1</span></p>

      <h3>AFC Standings</h3>
      <div id="afc-standings"></div>

      <h3>NFC Standings</h3>
      <div id="nfc-standings"></div>

      <h3>AFC Best Teams</h3>
      <div id="afc-best"></div>

      <h3>NFC Best Teams</h3>
      <div id="nfc-best"></div>
    </section>
  </div>

<script src="script.js?v=1"></script>

</body>
</html>
