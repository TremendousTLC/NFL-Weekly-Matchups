<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NFL Weekly Matchup-24</title>
  <script defer src="script.js?v=24"></script>
  <link rel="stylesheet" href="styles24.css">
</head>

<body>

  <!-- LOGO BANNER -->
  <div id="logo-banner"></div>

  <!-- MAIN LAYOUT: LEFT / CENTER / RIGHT -->
  <div id="main-layout">

    <!-- ============================================================
         LEFT PANEL
    ============================================================ -->
    <section id="left-panel">

      <h2>Player</h2>

      <input id="player-name-input" type="text" placeholder="Enter name">
      <button id="add-player-btn">Add Player</button>

      <h3>Select Player</h3>
      <select id="player-list"></select>
      <button id="delete-player-btn">Delete Player</button>

      <button id="show-weekly-picks-btn">Show Weekly Picks</button>

      <h3>Pick Details</h3>
      <div id="picks-detail-window"></div>

      <h3>League Standings</h3>
      <div class="standings-box">
        <h4>Weekly Leaderboard</h4>
        <div id="weekly-leaderboard"></div>

        <h4>Season Standings</h4>
        <div id="season-standings"></div>
      </div>

    </section>

    <!-- ============================================================
         WEEKLY PICKS PANEL
    ============================================================ -->
    <section id="weekly-picks-panel">

      <h2>Weekly Picks</h2>

      <div id="week-nav">
        <button id="prev-week-btn">◀ Prev</button>
        <span id="current-week-label">Week -</span>
        <button id="next-week-btn">Next ▶</button>
      </div>

      <div id="weekly-picks"></div>

      <div class="picks-actions">
        <button id="submit-picks-btn">Submit Picks</button>
        <button id="edit-picks-btn">Edit Picks</button>
      </div>

    </section>

    <!-- ============================================================
         RIGHT PANEL
    ============================================================ -->
    <section id="right-panel">

      <h2 id="nfl-title">
        NFL Team Standings
        <span id="current-nfl-week"></span>
      </h2>

      <div class="standings-box">
        <h3>AFC Standings</h3>
        <div id="afc-standings"></div>
      </div>

      <div class="standings-box">
        <h3>NFC Standings</h3>
        <div id="nfc-standings"></div>
      </div>

      <div class="standings-box">
        <h3>AFC Team Leaders</h3>
        <div id="afc-leaders"></div>
      </div>

      <div class="standings-box">
        <h3>NFC Team Leaders</h3>
        <div id="nfc-leaders"></div>
      </div>

      <div class="standings-box">
        <h3>NFL Playoffs</h3>
        <div id="nfl-playoffs"></div>
      </div>

    </section>

  </div> <!-- END MAIN LAYOUT -->
    
  </body>
</html>
