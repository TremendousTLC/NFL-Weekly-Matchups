<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NFL Weekly Matchup 01</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b162a;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #101820;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #c8102e;
    }
    .app-title {
      font-size: 24px;
      font-weight: bold;
    }
    .nfl-menu button {
      margin-left: 8px;
      padding: 6px 10px;
      background: #c8102e;
      border: none;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }
    main {
      padding: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .top-panel {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
      gap: 16px;
    }
    .leaderboard, .user-panel {
      background: #1c2b3a;
      padding: 12px;
      border-radius: 6px;
      flex: 1 1 300px;
    }
    .leaderboard h2, .user-panel h2 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid #c8102e;
      padding-bottom: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      background: #1c2b3a;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid #2f3f4f;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #101820;
    }
    .team-button {
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      margin-right: 4px;
    }
    .team-button.away {
      background: #3b82f6;
      color: #fff;
    }
    .team-button.home {
      background: #22c55e;
      color: #fff;
    }
    .team-button.selected {
      box-shadow: 0 0 0 2px #facc15;
    }
    #weekNav {
      margin-top: 20px;
      text-align: center;
    }
    #weekNav button {
      padding: 6px 12px;
      background: #c8102e;
      border: none;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      margin: 0 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="app-title" id="appTitle">NFL Weekly Matchup</div>
  <div class="nfl-menu">
    <button>Standings</button>
    <button>Schedule</button>
    <button>Injury Report</button>
  </div>
</header>

<main>

  <div class="top-panel">
    <section class="leaderboard">
      <h2>Leaderboard</h2>
      <div id="leaderboardShort">
        <div>Season Leader: <strong id="seasonLeader">TBD</strong></div>
        <div>Last Week Winner: <strong id="lastWeekWinner">TBD</strong></div>
      </div>
      <button onclick="showFullLeaderboard()">Show Full Leaderboard</button>
    </section>

    <section class="user-panel">
      <h2>Your Info</h2>
      <label for="userName">Enter your name:</label>
      <input type="text" id="userName" placeholder="e.g., Terry">
      <button onclick="setCurrentUser()">Set Player</button>
      <div id="currentUserDisplay" style="margin-top:8px;font-size:14px;">
        Current Player: <strong id="currentUserName">None</strong>
      </div>
    </section>
  </div>

  <div id="weekNav">
    <button onclick="prevWeek()">Prev Week</button>
    <span id="weekLabel" style="font-size:18px;font-weight:bold;"></span>
    <button onclick="nextWeek()">Next Week</button>
  </div>

  <section>
    <table id="matchupTable">
      <thead>
        <tr>
          <th>Game</th>
          <th>Date</th>
          <th>Time</th>
          <th>TV</th>
          <th>Away</th>
          <th>Home</th>
          <th>Your Pick</th>
        </tr>
      </thead>
      <tbody id="matchupBody"></tbody>
    </table>
  </section>

</main>

<script>
let schedule = null;
let currentWeek = 1;
let currentUser = null;
const picksByUser = JSON.parse(localStorage.getItem("picksByUser") || "{}");

function setCurrentUser() {
  const name = document.getElementById("userName").value.trim();
  if (!name) return alert("Enter a name first.");
  currentUser = name;
  document.getElementById("currentUserName").textContent = currentUser;
  if (!picksByUser[currentUser]) picksByUser[currentUser] = {};
  savePicks();
}

function savePicks() {
  localStorage.setItem("picksByUser", JSON.stringify(picksByUser));
}

function selectPick(gameId, teamName) {
  if (!currentUser) return alert("Set your name first.");
  picksByUser[currentUser][gameId] = teamName;
  savePicks();
  document.getElementById("pick-" + gameId).textContent = teamName;
  highlightButtons(gameId, teamName);
}

function highlightButtons(gameId, teamName) {
  const row = document.querySelector(`tr[data-game-id="${gameId}"]`);
  row.querySelectorAll(".team-button").forEach(btn => btn.classList.remove("selected"));
  const btn = row.querySelector(`button[data-team="${teamName}"]`);
  if (btn) btn.classList.add("selected");
}

function renderWeek(week) {
  const weekData = schedule.weeks[String(week)];
  document.getElementById("weekLabel").textContent = "Week " + week;
  document.getElementById("appTitle").textContent = "NFL Weekly Matchup – Week " + week;

  const tbody = document.getElementById("matchupBody");
  tbody.innerHTML = "";

  weekData.games.forEach((g, index) => {
    const gameId = index + 1;
    const pick = currentUser && picksByUser[currentUser] ? picksByUser[currentUser][gameId] || "–" : "–";

    const row = document.createElement("tr");
    row.dataset.gameId = gameId;

    row.innerHTML = `
      <td>Game ${gameId}</td>
      <td>${g.date}</td>
      <td>${g.time}</td>
      <td>${g.tv}</td>
      <td>
        <button class="team-button away" data-team="${g.away}" onclick="selectPick(${gameId}, '${g.away}')">${g.away}</button>
      </td>
      <td>
        <button class="team-button home" data-team="${g.home}" onclick="selectPick(${gameId}, '${g.home}')">${g.home}</button>
      </td>
      <td id="pick-${gameId}">${pick}</td>
    `;

    tbody.appendChild(row);

    if (pick !== "–") highlightButtons(gameId, pick);
  });
}

function prevWeek() {
  if (currentWeek > 1) {
    currentWeek--;
    renderWeek(currentWeek);
  }
}

function nextWeek() {
  if (currentWeek < 18) {
    currentWeek++;
    renderWeek(currentWeek);
  }
}

function detectCurrentWeek() {
  return 2; // You can replace this with real date logic later
}

function showFullLeaderboard() {
  alert("Full leaderboard coming soon.");
}

fetch("2026_NFL_schedule.json")
  .then(r => r.json())
  .then(data => {
    schedule = data;
    currentWeek = detectCurrentWeek();
    renderWeek(currentWeek);
  });
</script>

</body>
</html>
